server:
  workers: 6

  config:
    query:
      # 클러스터 전체가 한 쿼리에 쓸 수 있는 상한.
      # 워커 6 × 힙 8G = 48G 중 넉넉히 남기고 잡는다.
      maxMemory: "30GB"

coordinator:
  jvm:
    maxHeapSize: "8G"
  config:
    query:
      maxMemoryPerNode: "5GB"
  resources:
    requests:
      cpu: 2
      memory: 10Gi
    limits:
      cpu: 4
      memory: 11Gi

worker:
  jvm:
    maxHeapSize: "8G"
  config:
    query:
      maxMemoryPerNode: "5GB"
  resources:
    requests:
      cpu: 2
      memory: 10Gi
    limits:
      cpu: 4
      memory: 11Gi

additionalConfigProperties:
  # 해시 조인·집계가 힙에 안 들어갈 때 디스크로 흘려보냄.
  - spill-enabled=true
  - spiller-spill-path=/tmp/trino-spill
  - max-spill-per-node=50GB
  - query-max-spill-per-node=25GB

# 강의의 trino_config/catalog/iceberg.properties 를 그대로 옮긴 것
catalogs:
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=nessie
    iceberg.nessie-catalog.uri=http://nessie.lakehouse-k3s.svc.cluster.local:19120/api/v2
    iceberg.nessie-catalog.ref=main
    iceberg.nessie-catalog.default-warehouse-dir=s3://local-lakehouse
    fs.native-s3.enabled=true
    s3.endpoint=http://minio.minio.svc.cluster.local:9000
    s3.region=us-east-1
    s3.path-style-access=true
    # lakehouse-k3s 네임스페이스에 minio-secret 사용
    s3.aws-access-key=${ENV:MINIO_USER}
    s3.aws-secret-key=${ENV:MINIO_PASSWORD}

env:
  - name: MINIO_USER
    valueFrom:
      secretKeyRef:
        name: minio-secret
        key: minio-user
  - name: MINIO_PASSWORD
    valueFrom:
      secretKeyRef:
        name: minio-secret
        key: minio-password
